[package]
name = "lighthouse-test-client"
version = "0.2.0"
edition = "2021"
authors = ["Jac0xb"]
description = "A simple CLI application to test Lighthouse on Solana network"

[dependencies]
bincode = "^1.3"
borsh = { version = "^1.0", features = ["derive"] }
clap = { version = "^4.5", features = ["derive"] }
lighthouse-sdk = { path = "../../clients/rust", version = "3.0.0" }
rayon = "^1.10"
serde_json = "^1.0"
solana-client = "^3.1"
solana-commitment-config = "^3.1"
solana-rpc-client-api = "^3.1"
solana-sdk = "^3.0"
solana-stake-interface = { version = "^2.0", features = ["bincode", "borsh"] }
solana-system-interface = { version = "^3.0", features = ["bincode"] }
spl-associated-token-account-interface = "^2.0"
spl-token-interface = "^2.0"
