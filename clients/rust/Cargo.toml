[package]
name = "lighthouse-sdk"
version = "3.0.0"
edition = "2021"
rust-version = "1.89"
readme = "README.md"
description = "A rust client for Lighthouse, a transaction safeguard Solana program"
repository = "https://github.com/Jac0xb/lighthouse"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
serde = ["dep:serde", "dep:serde_with", "lighthouse-common/serde", "solana-address/serde"]
cpi = []
sdk = [
    "dep:base64",
    "dep:solana-message",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:wincode",
]

default = []

[dependencies]
base64 = { version = "^0.22", optional = true }
borsh = { version = "^1.0", features = ["derive"] }
lighthouse-common = { path = "../../lighthouse-common", version = "3.0.0" }
num-derive = "^0.4"
num-traits = "^0.2"
serde = { version = "^1.0", features = ["derive"], optional = true }
serde_with = { version = "^3.21", optional = true }
solana-account-info = "^3.1"
solana-address = { version = "^2.2", features = ["borsh", "copy", "curve25519", "decode"] }
solana-cpi = "^3.1"
solana-instruction = "^3.2"
solana-message = { version = "^6.0", features = ["wincode"], optional = true }
solana-program-error = "^3.0"
solana-signer = { version = "^4.0", optional = true }
solana-transaction = { version = "^6.0", features = ["wincode"], optional = true }
thiserror = "^1.0"
wincode = { version = "^0.6", optional = true }

[dev-dependencies]
assert_matches = "1.5.0"
base64 = "^0.22"
serde_json = "^1.0"
solana-keypair = "^4.0"
solana-transaction = { version = "^6.0", features = ["verify", "wincode"] }

[[test]]
name = "transactions"
path = "tests/transactions.rs"
required-features = ["sdk"]
