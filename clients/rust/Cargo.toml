[package]
name = "lighthouse-sdk"
version = "3.0.0"
edition = "2021"
readme = "README.md"
description = "A rust client for Lighthouse, a transaction safeguard Solana program"
repository = "https://github.com/Jac0xb/lighthouse"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
serde = ["dep:serde", "dep:serde_with", "lighthouse-common/serde", "solana-address/serde"]
cpi = []
sdk = ["dep:base64", "dep:solana-message", "dep:solana-signer", "dep:solana-transaction"]

default = []

[dependencies]
base64 = { version = "^0.22", optional = true }
borsh = { version = "^1.0", features = ["derive"] }
lighthouse-common = { path = "../../lighthouse-common", version = "3.0.0" }
num-derive = "^0.4"
num-traits = "^0.2"
serde = { version = "^1.0", features = ["derive"], optional = true }
serde_with = { version = "^3.0", optional = true }
solana-account-info = "^3.1"
solana-address = { version = "^2.2", features = ["borsh", "copy", "curve25519", "decode"] }
solana-cpi = "^3.1"
solana-instruction = "^3.2"
solana-message = { version = "^3.0", optional = true }
solana-program-error = "^3.0"
solana-signer = { version = "^3.0", optional = true }
solana-transaction = { version = "^3.0", features = ["bincode"], optional = true }
thiserror = "^1.0"

[dev-dependencies]
assert_matches = "1.5.0"
serde_json = "^1.0"
